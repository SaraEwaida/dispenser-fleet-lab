name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }

      - name: Create test database
        run: PGPASSWORD=fleet psql -h localhost -U fleet -d fleet -c "CREATE DATABASE fleet_test"

      - name: Backend tests (unit, integration, real MQTT)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Build console
        working-directory: frontend
        run: npm ci && npm run build

      - name: Start the fleet
        working-directory: backend
        env:
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
        run: |
          alembic upgrade head
          python -m app.db.seed
          nohup uvicorn app.main:app --port 8100 > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8100/api/v1/health && break; sleep 1; done

      - name: API tests (Newman)
        run: npx --yes newman@6 run postman/Dispenser-Fleet-Lab.postman_collection.json -e postman/local.postman_environment.json --env-var baseUrl=http://localhost:8100

      - name: Browser tests (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            e2e/results/
            e2e/test-results/
            server.log
          if-no-files-found: ignore
